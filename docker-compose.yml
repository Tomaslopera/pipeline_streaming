services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    ports:
      # Puerto expuesto al host para que el productor (python en localhost:9092) conecte.
      - "9092:9095"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      # 9092 = listener interno (usado por el contenedor de Spark via "kafka:9092")
      # 9094 = listener del controller KRaft (interno, no se usa fuera del broker)
      # 9095 = listener externo (mapeado a 9092 del host, para el productor/consumidor local)
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9094,EXTERNAL://:9095
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9094
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: bitnamilegacy/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce --partitions 3 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic ecommerce

  spark:
    image: bitnamilegacy/spark:3.5.3
    container_name: spark
    depends_on:
      - kafka
    volumes:
      - ./:/app
    working_dir: /app
    # El contenedor queda vivo; el detector se lanza a mano con run_detector.sh
    # para poder ver el log en vivo y tomar las capturas que pide el enunciado.
    command: ["tail", "-f", "/dev/null"]

volumes:
  kafka_data:
    driver: local
